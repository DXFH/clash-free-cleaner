name: 每日自动清洗 + 1X/2X/5X 过滤 + Clash 配置生成

on:
  schedule:
    - cron: '0 0 * * *'      # 北京时间每天 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install aiohttp pyyaml

      - name: 执行优化脚本
        run: python optimize.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          git commit -m "Auto: 清洗 + 优化 $(date '+%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git pull origin main --rebase || true  # 先拉取远程，rebase 本地 commit
          git push origin main
